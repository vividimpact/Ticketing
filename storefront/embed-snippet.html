<!--
  REFERENCE ONLY — do not apply yet.

  This is the thin stub that will REPLACE each storefront's
  partials/supportTicket.html. The route stays the same:

      when('/supportticket', {
          templateUrl: 'partials/supportTicket.html',
          controller: 'SupportTicketCtrl'
      })

  The new supportTicket.html becomes just this iframe host, and the new
  SupportTicketCtrl (below) shrinks to ~20 lines whose only jobs are:
    1. hand the signed-in Four51 user + category tree to the iframe, and
    2. auto-size the iframe to its content.

  After this is in place, all future changes to the ticket form happen once in
  the ticketing repo and are deployed as static files to the app server — they
  propagate to every storefront with no storefront redeploys.

  Values the storefront passes in (the iframe cannot see them itself):
    - env: 'test' when window.location.host === 'teststore.four51.com', else 'production'
    - user: the signed-in Four51 user ($scope.user)
    - categoryTree: the storefront's own $scope.tree (product categories)
    - color: the storefront brand color (was the platform btn-centerwell theme)
    - vampireToken: the existing Ticketing-app client JWT this storefront already
        ships in its current supportTicketCtrl.js. It is NOT committed in the
        ticketing repo — paste the storefront's existing token here.
-->

<!-- ===== partials/supportTicket.html (new contents) ===== -->
<section class="support-ticket-embed">
    <iframe id="ticketingFrame"
            src="https://apps.vividimpact.com/ticketing/"
            style="width:100%; border:0; min-height:600px;"
            title="Vivid Support Ticket"
            referrerpolicy="no-referrer"></iframe>
</section>

<!--
  ===== SupportTicketCtrl (new contents) =====
  Drop-in replacement for the current supportTicketCtrl.js. Keeps the same
  controller name and route so nothing else in the storefront changes.

four51.app.controller('SupportTicketCtrl', ['$scope', function ($scope) {
    // TO CONFIRM: the app server origin (must match the iframe src origin).
    var IFRAME_ORIGIN = 'https://apps.vividimpact.com';

    var env = (window.location.host === 'teststore.four51.com') ? 'test' : 'production';

    function sendInit() {
        var frame = document.getElementById('ticketingFrame');
        if (!frame || !frame.contentWindow || !$scope.user) return;
        frame.contentWindow.postMessage({
            type: 'ticketing:init',
            payload: {
                env: env,
                storefront: window.location.host,
                // The existing Ticketing-app client JWT this storefront already
                // ships today in supportTicketCtrl.js. Paste that same token here
                // — it is intentionally NOT committed in the ticketing repo.
                vampireToken: '__VAMPIRE_TICKETING_CLIENT_JWT__',
                // Storefront brand color for the ticket banner + Create button
                // (previously the platform theme color, e.g. btn-centerwell).
                // TO CONFIRM: how each storefront exposes its brand color.
                color: '#1d4f91',
                user: {
                    id: $scope.user.ID,
                    firstName: $scope.user.FirstName,
                    lastName: $scope.user.LastName,
                    email: $scope.user.Email,
                    companyName: $scope.user.Company && $scope.user.Company.Name,
                    allowTicketing: $scope.user.AllowTicketing === true,
                    ticketingDashboard: $scope.user.TicketingDashboard === true
                },
                categoryTree: $scope.tree || []
            }
        }, IFRAME_ORIGIN);
    }

    // The iframe announces itself when ready; respond with the init payload.
    // Also auto-size the frame as its content grows/shrinks.
    window.addEventListener('message', function (evt) {
        if (evt.origin !== IFRAME_ORIGIN) return;
        var msg = evt.data || {};
        if (msg.type === 'ticketing:ready') {
            sendInit();
        } else if (msg.type === 'ticketing:resize' && msg.height) {
            var frame = document.getElementById('ticketingFrame');
            if (frame) frame.style.height = (msg.height + 24) + 'px';
        }
    });

    // In case the iframe loaded before this controller wired up.
    sendInit();
}]);
-->
